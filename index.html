<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FinBot 💰</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --wa-bg:     #0b141a;
  --wa-chat:   #111b21;
  --wa-header: #202c33;
  --wa-input:  #202c33;
  --wa-mine:   #005c4b;
  --wa-theirs: #202c33;
  --wa-accent: #00a884;
  --wa-text:   #e9edef;
  --wa-sub:    #8696a0;
  --wa-border: rgba(134,150,160,0.15);
  --income:    #25d366;
  --expense:   #ff6b6b;
  --ant:       #ffb347;
  --rat:       #c084fc;
}
html,body { height:100%; background:var(--wa-bg); color:var(--wa-text); font-family:'Nunito',sans-serif; overflow:hidden; }
body { display:flex; flex-direction:column; height:100dvh; }

/* HEADER */
header { background:var(--wa-header); padding:10px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--wa-border); flex-shrink:0; z-index:10; }
.bot-avatar { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,#00a884,#005c4b); display:flex; align-items:center; justify-content:center; font-size:20px; }
.bot-info { flex:1; }
.bot-name { font-size:15px; font-weight:700; }
.bot-status { font-size:12px; color:var(--wa-accent); }
.header-btns { display:flex; gap:4px; }
.hbtn { width:36px; height:36px; border-radius:50%; border:none; background:transparent; color:var(--wa-sub); font-size:18px; cursor:pointer; }

/* SUMMARY */
#summary { background:var(--wa-header); border-bottom:1px solid var(--wa-border); padding:8px 16px; display:flex; gap:8px; overflow-x:auto; flex-shrink:0; scrollbar-width:none; }
.sum-chip { flex-shrink:0; padding:5px 12px; border-radius:12px; font-size:11px; font-weight:700; background:rgba(255,255,255,.05); border:1px solid var(--wa-border); white-space:nowrap; }
.sum-chip .val { font-size:13px; }
.sum-chip.inc { border-color:rgba(37,211,102,.3); color:var(--income); }
.sum-chip.exp { border-color:rgba(255,107,107,.3); color:var(--expense); }
.sum-chip.bal { border-color:rgba(0,168,132,.3); color:var(--wa-accent); }

/* CHAT */
#chat { flex:1; overflow-y:auto; padding:12px; background-image: radial-gradient(circle at 20% 30%, rgba(0,168,132,.03) 0%, transparent 50%); }
.bubble-wrap { display:flex; margin-bottom:8px; }
.bubble-wrap.mine { justify-content:flex-end; }
.bubble-wrap.theirs { justify-content:flex-start; }
.bubble { max-width:85%; padding:8px 12px; border-radius:8px; font-size:14px; line-height:1.5; position:relative; }
.bubble-wrap.mine .bubble { background:var(--wa-mine); border-top-right-radius:2px; }
.bubble-wrap.theirs .bubble { background:var(--wa-theirs); border-top-left-radius:2px; }
.time { font-size:10px; color:rgba(134,150,160,.8); float:right; margin-top:4px; margin-left:8px; }

/* CARDS */
.income-card { border-left:4px solid var(--income); }
.expense-card { border-left:4px solid var(--expense); }
.ant-card { border-left:4px solid var(--ant); background:rgba(255,179,71,0.1) !important; }

/* INPUT */
#input-area { background:var(--wa-bg); padding:10px 12px 25px; display:flex; gap:8px; border-top:1px solid var(--wa-border); }
#msg-inp { flex:1; background:var(--wa-input); border:none; border-radius:24px; color:white; padding:12px 16px; outline:none; resize:none; font-family:inherit; }
#send-btn { width:48px; height:48px; border-radius:50%; background:var(--wa-accent); border:none; color:white; cursor:pointer; font-size:20px; }

/* TYPING */
#typing { display:none; padding:8px 16px; }
#typing.show { display:flex; }
.td { width:6px; height:6px; background:var(--wa-sub); border-radius:50%; margin:0 2px; animation: bounce 1s infinite; }
@keyframes bounce { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
</style>
</head>
<body>

<header>
  <div class="bot-avatar">🤖</div>
  <div class="bot-info">
    <div class="bot-name">FinBot 💰</div>
    <div class="bot-status" id="bot-status">En línea</div>
  </div>
  <div class="header-btns">
    <button class="hbtn" onclick="showSummary()">📊</button>
    <button class="hbtn" onclick="doReset()">🔄</button>
  </div>
</header>

<div id="summary">
  <div class="sum-chip inc">💚 Ingresos <span class="val" id="s-inc">$0.00</span></div>
  <div class="sum-chip exp">❤️ Gastos <span class="val" id="s-exp">$0.00</span></div>
  <div class="sum-chip bal">💎 Balance <span class="val" id="s-bal">$0.00</span></div>
</div>

<div id="chat"></div>
<div id="typing"><div class="td"></div><div class="td"></div><div class="td"></div></div>

<div id="input-area">
  <textarea id="msg-inp" placeholder="Escribe aquí..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMsg()">➤</button>
</div>

<script>
const KEY = "AIzaSyAvZvbHMISeBjHsnzcM6mJzkC6FFBVbZlQ";
const ANT_CATEGORIES = ['café','soda','chicle','snack','cigarro','cerveza','dulce'];

let state = JSON.parse(localStorage.getItem('fin_state')) || {
  inc: 0, exp: 0, ant: 0, history: []
};

function save() { localStorage.setItem('fin_state', JSON.stringify(state)); }

function updateUI() {
  document.getElementById('s-inc').textContent = '$' + state.inc.toFixed(2);
  document.getElementById('s-exp').textContent = '$' + state.exp.toFixed(2);
  document.getElementById('s-bal').textContent = '$' + (state.inc - state.exp).toFixed(2);
}

function append(text, side, type = '') {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = `bubble-wrap ${side}`;
  const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  // Formatear negritas de la IA
  const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  div.innerHTML = `<div class="bubble ${type}">${formattedText}<span class="time">${t}</span></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function askAI(prompt) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;
  const context = `Eres FinBot. Balance: $${(state.inc - state.exp)}. Responde corto (2 líneas) en español. Si es gasto, motiva a ahorrar.`;
  
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: context + "\nUsuario: " + prompt }] }]
      })
    });
    const data = await res.json();
    return data.candidates[0].content.parts[0].text;
  } catch (e) {
    return "Error de conexión. Intenta de nuevo.";
  }
}

function parseText(text) {
  const low = text.toLowerCase();
  const amtMatch = text.match(/\d+(\.\d+)?/);
  if (!amtMatch) return;
  const val = parseFloat(amtMatch[0]);

  if (['cobré','gané','recibí','pago','sueldo','ingreso'].some(k => low.includes(k))) {
    state.inc += val;
    append(`✅ Registrado ingreso de **$${val}**`, 'theirs', 'income-card');
  } else if (['gasté','pagué','compré','costó','gasto'].some(k => low.includes(k))) {
    state.exp += val;
    const isAnt = val < 5 || ANT_CATEGORIES.some(k => low.includes(k));
    if (isAnt) state.ant += val;
    append(`❤️ Registrado gasto de **$${val}**${isAnt?' 🐜':''}`, 'theirs', isAnt ? 'ant-card' : 'expense-card');
  }
  save();
  updateUI();
}

async function sendMsg() {
  const inp = document.getElementById('msg-inp');
  const txt = inp.value.trim();
  if (!txt) return;

  inp.value = '';
  append(txt, 'mine');
  parseText(txt);

  document.getElementById('typing').style.display = 'flex';
  const reply = await askAI(txt);
  document.getElementById('typing').style.display = 'none';
  append(reply, 'theirs');
}

function showSummary() {
  append(`📊 **Resumen:**\nIngresos: $${state.inc}\nGastos: $${state.exp}\nHormiga: $${state.ant}`, 'theirs');
}

function doReset() {
  if(confirm("¿Reiniciar todo?")) {
    state = { inc: 0, exp: 0, ant: 0, history: [] };
    save(); updateUI();
    document.getElementById('chat').innerHTML = '';
    append("Sistema reiniciado. ¡Hola!", "theirs");
  }
}

window.onload = () => {
  updateUI();
  append("¡Hola! Soy **FinBot**. ¿Qué registramos hoy?", "theirs");
};

document.getElementById('msg-inp').onkeydown = (e) => { if(e.key === 'Enter') sendMsg(); };
</script>
</body>
</html>
