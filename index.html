<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>FinBot 💰</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

:root {
  --wa-bg:     #0b141a;
  --wa-chat:   #111b21;
  --wa-header: #202c33;
  --wa-input:  #202c33;
  --wa-mine:   #005c4b;
  --wa-theirs: #202c33;
  --wa-accent: #00a884;
  --wa-text:   #e9edef;
  --wa-sub:    #8696a0;
  --wa-border: rgba(134,150,160,0.15);
  --income:    #25d366;
  --expense:   #ff6b6b;
  --ant:       #ffb347;
  --rat:       #c084fc;
}

html,body { height:100%; background:var(--wa-bg); color:var(--wa-text); font-family:'Nunito',sans-serif; overflow:hidden; }
body { display:flex; flex-direction:column; height:100dvh; }

/* ── HEADER ── */
header {
  background:var(--wa-header);
  padding:10px 16px;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid var(--wa-border);
  flex-shrink:0; z-index:10;
}
.bot-avatar {
  width:40px; height:40px; border-radius:50%;
  background:linear-gradient(135deg,#00a884,#005c4b);
  display:flex; align-items:center; justify-content:center;
  font-size:20px; flex-shrink:0;
}
.bot-info { flex:1; }
.bot-name { font-size:15px; font-weight:700; }
.bot-status { font-size:12px; color:var(--wa-accent); }
.header-btns { display:flex; gap:4px; }
.hbtn {
  width:36px; height:36px; border-radius:50%; border:none;
  background:transparent; color:var(--wa-sub); font-size:18px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:background .15s;
}
.hbtn:active { background:rgba(255,255,255,.08); }

/* ── SUMMARY STRIP ── */
#summary {
  background:var(--wa-header);
  border-bottom:1px solid var(--wa-border);
  padding:8px 16px;
  display:flex; gap:8px; overflow-x:auto;
  flex-shrink:0; scrollbar-width:none;
}
#summary::-webkit-scrollbar { display:none; }
.sum-chip {
  flex-shrink:0; padding:5px 12px; border-radius:12px;
  font-size:11px; font-weight:700; background:rgba(255,255,255,.05);
  border:1px solid var(--wa-border); white-space:nowrap;
  display:flex; gap:5px; align-items:center;
}
.sum-chip .val { font-size:13px; }
.sum-chip.inc  { border-color:rgba(37,211,102,.3); color:var(--income); }
.sum-chip.exp  { border-color:rgba(255,107,107,.3); color:var(--expense); }
.sum-chip.bal  { border-color:rgba(0,168,132,.3);   color:var(--wa-accent); }
.sum-chip.ant  { border-color:rgba(255,179,71,.3);  color:var(--ant); }

/* ── CHAT AREA ── */
#chat {
  flex:1; overflow-y:auto; padding:12px 12px 8px;
  scrollbar-width:thin; scrollbar-color:var(--wa-header) transparent;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(0,168,132,.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,92,75,.04) 0%, transparent 50%);
}

/* Date separator */
.date-sep {
  text-align:center; margin:10px 0;
  font-size:11px; color:var(--wa-sub);
}
.date-sep span {
  background:rgba(11,20,26,.8); backdrop-filter:blur(4px);
  padding:4px 12px; border-radius:8px;
  border:1px solid var(--wa-border);
}

/* Bubble base */
.bubble-wrap { display:flex; margin-bottom:4px; }
.bubble-wrap.mine { justify-content:flex-end; }
.bubble-wrap.theirs { justify-content:flex-start; }

.bubble {
  max-width:82%; padding:8px 10px 6px;
  border-radius:8px; font-size:14px; line-height:1.5;
  position:relative; word-wrap:break-word;
}
.bubble-wrap.mine .bubble {
  background:var(--wa-mine);
  border-top-right-radius:2px;
}
.bubble-wrap.theirs .bubble {
  background:var(--wa-theirs);
  border-top-left-radius:2px;
}

.bubble .time {
  font-size:10px; color:rgba(134,150,160,.8);
  float:right; margin-top:2px; margin-left:8px;
}

/* Bubble variants */
.bubble.income-card  { border-left:3px solid var(--income); }
.bubble.expense-card { border-left:3px solid var(--expense); }
.bubble.ant-card     { border-left:3px solid var(--ant); background:rgba(255,179,71,.08); }
.bubble.rat-card     { border-left:3px solid var(--rat); background:rgba(192,132,252,.08); }
.bubble.alert-card   { border-left:3px solid var(--expense); background:rgba(255,107,107,.08); }
.bubble.summary-card { border-left:3px solid var(--wa-accent); }

/* Card internals */
.card-title { font-size:12px; font-weight:800; letter-spacing:.5px; margin-bottom:6px; opacity:.7; text-transform:uppercase; }
.card-amount { font-size:22px; font-weight:800; }
.card-desc { font-size:13px; opacity:.8; margin-top:2px; }
.card-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,.08); margin-top:6px; }

/* Summary table in bubble */
.sum-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
.sum-table td { padding:4px 6px; }
.sum-table tr:nth-child(even) td { background:rgba(255,255,255,.04); }
.sum-table .lbl { color:var(--wa-sub); }
.sum-table .val-inc { color:var(--income); font-weight:700; }
.sum-table .val-exp { color:var(--expense); font-weight:700; }
.sum-table .val-bal { color:var(--wa-accent); font-weight:800; font-size:14px; }
.sum-table .val-ant { color:var(--ant); font-weight:700; }
.sum-table .val-rat { color:var(--rat); font-weight:700; }

/* Ant list */
.ant-list { margin-top:6px; }
.ant-item {
  display:flex; justify-content:space-between; align-items:center;
  padding:5px 8px; border-radius:6px; margin-bottom:4px;
  background:rgba(255,179,71,.08); font-size:12px;
}
.ant-item .ai-cat { color:var(--ant); font-weight:700; }
.ant-item .ai-amt { color:var(--expense); font-weight:700; }

/* Typing indicator */
#typing {
  display:none; padding:4px 12px 10px;
}
#typing.show { display:flex; }
.typing-bubble {
  background:var(--wa-theirs); border-radius:8px;
  border-top-left-radius:2px;
  padding:10px 14px; display:flex; gap:4px; align-items:center;
}
.td { width:7px; height:7px; border-radius:50%; background:var(--wa-sub); animation:td .9s infinite ease-in-out; }
.td:nth-child(2){animation-delay:.2s} .td:nth-child(3){animation-delay:.4s}
@keyframes td{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-4px);opacity:1}}

/* ── INPUT ── */
#input-area {
  background:var(--wa-bg); padding:8px 12px 18px;
  display:flex; align-items:flex-end; gap:8px; flex-shrink:0;
  border-top:1px solid var(--wa-border);
}
#msg-inp {
  flex:1; background:var(--wa-input); border:none; border-radius:24px;
  color:var(--wa-text); font-family:inherit; font-size:14px;
  padding:10px 16px; outline:none; resize:none; max-height:120px;
  scrollbar-width:none; line-height:1.4;
}
#msg-inp::placeholder { color:var(--wa-sub); }
#msg-inp::-webkit-scrollbar { display:none; }
#send-btn {
  width:44px; height:44px; border-radius:50%;
  background:var(--wa-accent); border:none; color:#fff;
  font-size:20px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all .15s; flex-shrink:0;
}
#send-btn:active { transform:scale(.92); background:#008f71; }

/* ── MODAL (reset confirm) ── */
#modal-bg {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.7); backdrop-filter:blur(4px);
  z-index:100; align-items:center; justify-content:center;
}
#modal-bg.show { display:flex; }
#modal {
  background:var(--wa-header); border-radius:16px;
  padding:24px 20px; margin:20px; max-width:360px; width:100%;
  border:1px solid var(--wa-border);
}
#modal h3 { font-size:17px; font-weight:800; margin-bottom:8px; }
#modal p  { font-size:13px; color:var(--wa-sub); line-height:1.5; margin-bottom:20px; }
.modal-btns { display:flex; gap:10px; }
.mbtn {
  flex:1; padding:12px; border-radius:10px; border:none;
  font-family:inherit; font-size:14px; font-weight:700;
  cursor:pointer; transition:all .15s;
}
.mbtn.cancel { background:rgba(255,255,255,.07); color:var(--wa-text); }
.mbtn.confirm { background:#ef4444; color:#fff; }
.mbtn:active { transform:scale(.97); }
</style>
</head>
<body>

<header>
  <div class="bot-avatar">🤖</div>
  <div class="bot-info">
    <div class="bot-name">FinBot 💰</div>
    <div class="bot-status" id="bot-status">En línea</div>
  </div>
  <div class="header-btns">
    <button class="hbtn" title="Resumen" onclick="showSummary()">📊</button>
    <button class="hbtn" title="Reset" onclick="confirmReset()">🔄</button>
  </div>
</header>

<div id="summary">
  <div class="sum-chip inc">💚 Ingresos <span class="val" id="s-inc">$0</span></div>
  <div class="sum-chip exp">❤️ Gastos <span class="val" id="s-exp">$0</span></div>
  <div class="sum-chip bal">💎 Balance <span class="val" id="s-bal">$0</span></div>
  <div class="sum-chip ant">🐜 Hormigas <span class="val" id="s-ant">$0</span></div>
</div>

<div id="chat"></div>
<div id="typing">
  <div class="typing-bubble">
    <div class="td"></div><div class="td"></div><div class="td"></div>
  </div>
</div>

<div id="input-area">
  <textarea id="msg-inp" placeholder="Escribe tu gasto o ingreso..." rows="1"
    oninput="autoResize(this)"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
  ></textarea>
  <button id="send-btn" onclick="sendMsg()">➤</button>
</div>

<!-- Reset Modal -->
<div id="modal-bg">
  <div id="modal">
    <h3>⚠️ Reiniciar sistema</h3>
    <p>Esto borrará <strong>todos los registros activos</strong> pero guardará el historial en memoria para análisis futuro.<br><br>¿Estás seguro?</p>
    <div class="modal-btns">
      <button class="mbtn cancel" onclick="closeModal()">Cancelar</button>
      <button class="mbtn confirm" onclick="doReset()">Sí, reiniciar</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const ANT_CATEGORIES = ['café','coffee','snack','dulce','candy','refresco','soda','gaseosa','chicle','gum','chuco','antojito','colación','galleta','cookie','cheto','frituras','cigarro','cigarette','cerveza','beer','jugo','juice','agua','water','helado','ice cream','chocolate'];
const ANT_THRESHOLD  = 5; // gastos < $5 se marcan como posibles hormigas

let state = {
  transactions: [],   // {id, type, amount, desc, category, isAnt, ts}
  resetHistory: [],   // snapshots de resets anteriores
  chatHistory:  [],   // mensajes para la IA (últimos N)
  totalIncome:  0,
  totalExpense: 0,
  antTotal:     0,
  messageCount: 0
};

// ═══════════════════════════════════════
//  STORAGE (usa window.storage si existe, si no localStorage)
// ═══════════════════════════════════════
async function saveState() {
  try {
    if (window.storage) {
      await window.storage.set('finbot-state', JSON.stringify(state));
    } else {
      localStorage.setItem('finbot-state', JSON.stringify(state));
    }
  } catch(e) {}
}

async function loadState() {
  try {
    let raw = null;
    if (window.storage) {
      const r = await window.storage.get('finbot-state');
      raw = r ? r.value : null;
    } else {
      raw = localStorage.getItem('finbot-state');
    }
    if (raw) {
      const saved = JSON.parse(raw);
      Object.assign(state, saved);
    }
  } catch(e) {}
}

// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════
function now() {
  return new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});
}
function fmt(n) {
  return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
}
function isAntExpense(amount, desc) {
  if (amount > ANT_THRESHOLD) return false;
  const d = (desc||'').toLowerCase();
  return ANT_CATEGORIES.some(c => d.includes(c)) || amount <= 2;
}
function scrollBottom() {
  const c = document.getElementById('chat');
  setTimeout(() => c.scrollTop = c.scrollHeight, 50);
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function updateStrip() {
  const bal = state.totalIncome - state.totalExpense;
  document.getElementById('s-inc').textContent = fmt(state.totalIncome);
  document.getElementById('s-exp').textContent = fmt(state.totalExpense);
  document.getElementById('s-bal').textContent = fmt(bal);
  document.getElementById('s-ant').textContent = fmt(state.antTotal);
}

// ═══════════════════════════════════════
//  CHAT RENDER
// ═══════════════════════════════════════
function appendBubble(html, side='theirs', extraClass='') {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = `bubble-wrap ${side}`;
  wrap.innerHTML = `<div class="bubble ${extraClass}">${html}<span class="time">${now()}</span></div>`;
  chat.appendChild(wrap);
  scrollBottom();
}

function appendUserBubble(text) {
  appendBubble(`<span>${escHtml(text)}</span>`, 'mine');
}

function setTyping(on) {
  document.getElementById('typing').classList.toggle('show', on);
  document.getElementById('bot-status').textContent = on ? 'escribiendo...' : 'En línea';
  if (on) scrollBottom();
}

// ═══════════════════════════════════════
//  PARSE TRANSACTION (local, rápido)
// ═══════════════════════════════════════
function parseTransaction(text) {
  const t = text.toLowerCase().trim();

  // Income keywords
  const incomeKW = ['cobré','cobr','gané','gané','recibi','recibí','ingres','depósito','deposito','pago','me pagaron','salario','sueldo','venta','vendí'];
  // Expense keywords
  const expenseKW = ['gasté','gaste','pagué','pague','compr','gasto','cost','cobrar','salió','salio','perdí'];

  let type = null;
  if (incomeKW.some(k => t.includes(k))) type = 'income';
  else if (expenseKW.some(k => t.includes(k))) type = 'expense';

  // Extract amount — support $200, 200 pesos, 200.50, etc.
  const amtMatch = t.match(/[\$C]?\s*(\d{1,6}(?:[.,]\d{1,2})?)/);
  const amount = amtMatch ? parseFloat(amtMatch[1].replace(',','.')) : null;

  return { type, amount };
}

// ═══════════════════════════════════════
//  AI CALL
// ═══════════════════════════════════════
async function askAI(userMsg) {
  // Build context summary
  const bal = state.totalIncome - state.totalExpense;
  const antPct = state.totalExpense > 0 ? ((state.antTotal / state.totalExpense) * 100).toFixed(0) : 0;

  const systemPrompt = `Eres FinBot, un asistente contable financiero personal inteligente con personalidad cálida, directa y motivadora. Hablas en español informal (tuteo). Tu misión principal es:

1. DETECTAR y registrar ingresos/gastos del mensaje del usuario
2. DETECTAR gastos hormiga (pequeños gastos frecuentes que acumulan deuda sin que el usuario se dé cuenta)
3. Ayudar al usuario a SALIR DEL CÍRCULO DE LA RATA (trabajar solo para pagar gastos, sin libertad financiera)
4. Dar consejos prácticos basados en la filosofía de Padre Rico/Cashflow: activos vs pasivos, flujo de caja, inversión

ESTADO ACTUAL DE CUENTAS:
- Total ingresos: ${fmt(state.totalIncome)}
- Total gastos: ${fmt(state.totalExpense)}
- Balance actual: ${fmt(bal)}
- Gastos hormiga acumulados: ${fmt(state.antTotal)} (${antPct}% del total de gastos)
- Número de transacciones: ${state.transactions.length}

REGLAS DE RESPUESTA:
- Si el usuario registra un INGRESO: confirma con emoji 💚, felicítalo brevemente, da un consejo de cómo invertir o ahorrar ese dinero
- Si el usuario registra un GASTO: confirma con emoji ❤️, analiza si es hormiga 🐜, comenta si está afectando su libertad financiera
- Si detectas GASTO HORMIGA (< $5 o categorías como café, snacks, refresco, cigarros): alerta con 🐜 y explica el impacto acumulado mensual
- Si el balance es NEGATIVO: activa modo alerta roja 🚨, analiza qué está pasando
- Si el usuario pide RESUMEN o ANÁLISIS: da reporte completo con insights
- Si el usuario escribe /reset: confirma que borraste los datos y motivar a empezar de nuevo
- Si el usuario hace preguntas financieras generales: responde con sabiduría práctica del círculo de la rata, activos, pasivos, etc.

FORMATO DE RESPUESTA: Máximo 3-4 líneas. Directo, humano, sin tecnicismos innecesarios. Usa emojis moderadamente. Si das una cifra o dato importante, ponla en negritas con **cifra**.

NO respondas con listas largas. Sé conversacional como un amigo que sabe de finanzas.`;

  // Keep last 12 messages for context
  if (state.chatHistory.length > 12) state.chatHistory = state.chatHistory.slice(-12);
  state.chatHistory.push({ role:'user', content: userMsg });

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: systemPrompt,
      messages: state.chatHistory
    })
  });

  const data = await res.json();
  const reply = data.content?.[0]?.text || 'No pude procesar eso 😅';

  state.chatHistory.push({ role:'assistant', content: reply });
  await saveState();

  return reply;
}

// ═══════════════════════════════════════
//  RENDER TRANSACTION BUBBLE
// ═══════════════════════════════════════
function renderTransactionBubble(tx) {
  if (tx.type === 'income') {
    appendBubble(`
      <div class="card-title">💚 Ingreso registrado</div>
      <div class="card-amount" style="color:var(--income)">${fmt(tx.amount)}</div>
      <div class="card-desc">${escHtml(tx.desc)}</div>
    `, 'theirs', 'income-card');
  } else {
    const isAnt = tx.isAnt;
    appendBubble(`
      <div class="card-title">${isAnt ? '🐜 Gasto Hormiga detectado' : '❤️ Gasto registrado'}</div>
      <div class="card-amount" style="color:${isAnt ? 'var(--ant)' : 'var(--expense)'}">${fmt(tx.amount)}</div>
      <div class="card-desc">${escHtml(tx.desc)}</div>
      ${isAnt ? `<span class="card-tag" style="color:var(--ant)">⚠️ Acumulado hormiga: ${fmt(state.antTotal)}</span>` : ''}
    `, 'theirs', isAnt ? 'ant-card' : 'expense-card');
  }
}

// ═══════════════════════════════════════
//  MAIN SEND
// ═══════════════════════════════════════
async function sendMsg() {
  const inp = document.getElementById('msg-inp');
  const text = inp.value.trim();
  if (!text) return;

  inp.value = '';
  inp.style.height = 'auto';
  appendUserBubble(text);

  // Handle /reset command
  if (text.toLowerCase().startsWith('/reset') || text.toLowerCase().includes('reset') || text.toLowerCase().includes('reiniciar')) {
    confirmReset();
    return;
  }

  // Handle /resumen or summary requests
  if (text.toLowerCase().match(/\/(resumen|balance|reporte|summary)|^(resumen|balance|reporte|mi situaci)/)) {
    showSummary();
  }

  // Parse local transaction
  const parsed = parseTransaction(text);
  if (parsed.type && parsed.amount) {
    const tx = {
      id:     Date.now(),
      type:   parsed.type,
      amount: parsed.amount,
      desc:   text,
      isAnt:  parsed.type === 'expense' && isAntExpense(parsed.amount, text),
      ts:     new Date().toISOString()
    };
    state.transactions.push(tx);
    if (parsed.type === 'income') {
      state.totalIncome += parsed.amount;
    } else {
      state.totalExpense += parsed.amount;
      if (tx.isAnt) state.antTotal += parsed.amount;
    }
    updateStrip();
    renderTransactionBubble(tx);
  }

  // Send to AI
  setTyping(true);
  try {
    const reply = await askAI(text);
    setTyping(false);

    // Render AI response — detect if it's a rat-race advice
    const isRat = reply.toLowerCase().includes('círculo') || reply.toLowerCase().includes('rata') || reply.toLowerCase().includes('activo') || reply.toLowerCase().includes('pasivo');
    const extraClass = isRat ? 'rat-card' : '';
    // Convert **bold** markdown
    const formatted = reply.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
    appendBubble(formatted, 'theirs', extraClass);
  } catch(e) {
    setTyping(false);
    appendBubble('⚠️ Sin conexión con IA. Revisa tu internet.', 'theirs', 'alert-card');
  }
}

// ═══════════════════════════════════════
//  SUMMARY
// ═══════════════════════════════════════
function showSummary() {
  const bal = state.totalIncome - state.totalExpense;
  const antPct = state.totalExpense > 0 ? ((state.antTotal / state.totalExpense) * 100).toFixed(0) : 0;
  const txCount = state.transactions.length;
  const incCount = state.transactions.filter(t=>t.type==='income').length;
  const expCount = state.transactions.filter(t=>t.type==='expense').length;
  const antCount = state.transactions.filter(t=>t.isAnt).length;
  const statusColor = bal >= 0 ? 'var(--income)' : 'var(--expense)';
  const statusIcon  = bal >= 0 ? '✅' : '🚨';

  // Top ant categories
  const antTxs = state.transactions.filter(t=>t.isAnt);
  const antList = antTxs.slice(-5).reverse().map(t =>
    `<div class="ant-item"><span class="ai-cat">🐜 ${escHtml(t.desc.substring(0,30))}</span><span class="ai-amt">${fmt(t.amount)}</span></div>`
  ).join('');

  appendBubble(`
    <div class="card-title">📊 Resumen financiero</div>
    <table class="sum-table">
      <tr><td class="lbl">💚 Ingresos</td><td class="val-inc">${fmt(state.totalIncome)}</td></tr>
      <tr><td class="lbl">❤️ Gastos</td><td class="val-exp">${fmt(state.totalExpense)}</td></tr>
      <tr><td class="lbl">${statusIcon} Balance</td><td class="val-bal" style="color:${statusColor}">${fmt(bal)}</td></tr>
      <tr><td class="lbl">🐜 Hormigas</td><td class="val-ant">${fmt(state.antTotal)} (${antPct}%)</td></tr>
      <tr><td class="lbl">📋 Registros</td><td>${txCount} (${incCount} ingresos, ${expCount} gastos)</td></tr>
    </table>
    ${antCount > 0 ? `<div style="margin-top:8px;font-size:11px;color:var(--wa-sub);margin-bottom:4px;">ÚLTIMOS GASTOS HORMIGA</div>${antList}` : ''}
    <div style="margin-top:8px;font-size:11px;color:var(--wa-sub)">Resets anteriores: ${state.resetHistory.length}</div>
  `, 'theirs', 'summary-card');
}

// ═══════════════════════════════════════
//  RESET
// ═══════════════════════════════════════
function confirmReset() {
  document.getElementById('modal-bg').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('show');
}
async function doReset() {
  closeModal();

  // Save snapshot to history
  state.resetHistory.push({
    ts:           new Date().toISOString(),
    totalIncome:  state.totalIncome,
    totalExpense: state.totalExpense,
    antTotal:     state.antTotal,
    txCount:      state.transactions.length
  });

  // Clear active data
  const prev = { inc: state.totalIncome, exp: state.totalExpense, ant: state.antTotal };
  state.transactions  = [];
  state.chatHistory   = [];
  state.totalIncome   = 0;
  state.totalExpense  = 0;
  state.antTotal      = 0;

  updateStrip();
  await saveState();

  // Show reset message
  appendBubble(`
    <div class="card-title">🔄 Sistema reiniciado</div>
    <div class="card-desc" style="margin-bottom:8px">Los datos activos fueron borrados. El historial quedó guardado en memoria.</div>
    <table class="sum-table">
      <tr><td class="lbl">Período anterior</td><td></td></tr>
      <tr><td class="lbl">💚 Ingresos</td><td class="val-inc">${fmt(prev.inc)}</td></tr>
      <tr><td class="lbl">❤️ Gastos</td><td class="val-exp">${fmt(prev.exp)}</td></tr>
      <tr><td class="lbl">🐜 Hormigas</td><td class="val-ant">${fmt(prev.ant)}</td></tr>
      <tr><td class="lbl">📚 Resets totales</td><td>${state.resetHistory.length}</td></tr>
    </table>
  `, 'theirs', 'summary-card');

  // AI motivational message
  setTyping(true);
  try {
    const msg = `El usuario acaba de hacer un reset del sistema. Sus datos anteriores fueron: ingresos ${fmt(prev.inc)}, gastos ${fmt(prev.exp)}, gastos hormiga ${fmt(prev.ant)}. Dale un mensaje motivacional corto para empezar de nuevo, menciona algo específico de sus números anteriores y un consejo concreto para este nuevo periodo.`;
    const reply = await askAI(msg);
    setTyping(false);
    const formatted = reply.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
    appendBubble(formatted, 'theirs', 'rat-card');
  } catch {
    setTyping(false);
  }
}

// ═══════════════════════════════════════
//  WELCOME
// ═══════════════════════════════════════
async function welcome() {
  await loadState();
  updateStrip();

  const isReturning = state.transactions.length > 0 || state.resetHistory.length > 0;

  if (isReturning) {
    const bal = state.totalIncome - state.totalExpense;
    appendBubble(`
      <div class="card-title">👋 Bienvenido de vuelta</div>
      <div class="card-desc">Aquí está tu situación actual:</div>
      <table class="sum-table" style="margin-top:6px">
        <tr><td class="lbl">💚 Ingresos</td><td class="val-inc">${fmt(state.totalIncome)}</td></tr>
        <tr><td class="lbl">❤️ Gastos</td><td class="val-exp">${fmt(state.totalExpense)}</td></tr>
        <tr><td class="lbl">💎 Balance</td><td class="val-bal">${fmt(bal)}</td></tr>
        <tr><td class="lbl">🐜 Hormigas</td><td class="val-ant">${fmt(state.antTotal)}</td></tr>
      </table>
    `, 'theirs', 'summary-card');
  } else {
    appendBubble(`
      ¡Hola! 👋 Soy <strong>FinBot</strong>, tu asistente financiero personal.<br><br>
      Puedo ayudarte a:<br>
      💚 Registrar ingresos — <em>"Cobré $500"</em><br>
      ❤️ Registrar gastos — <em>"Gasté $3 en café"</em><br>
      🐜 Detectar <strong>gastos hormiga</strong><br>
      📊 Analizar tu situación — escribe <em>"resumen"</em><br>
      🔄 Reiniciar — botón 🔄 o escribe <em>"reset"</em>
    `, 'theirs');

    // First-time AI greeting
    setTyping(true);
    try {
      const reply = await askAI('Hola, acabo de iniciar la app. Soy nuevo usuario. Preséntate brevemente y dame el consejo más importante para empezar a controlar mis finanzas hoy mismo.');
      setTyping(false);
      const formatted = reply.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
      appendBubble(formatted, 'theirs', 'rat-card');
    } catch {
      setTyping(false);
    }
  }
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──
welcome();
</script>
</body>
</html>
