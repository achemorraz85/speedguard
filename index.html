<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Rich Dad AI - Asesor Financiero con IA</title>
    <style>
        :root {
            --whatsapp-green: #075e54;
            --whatsapp-light-green: #128c7e;
            --chat-bg: #e5ddd5;
            --bubble-user: #dcf8c6;
            --bubble-bot: #ffffff;
            --text-dark: #303030;
            --accent-gold: #c8960c;
            --card-bg: #f8f9fa;
            --shadow: 0 1px 2px rgba(0,0,0,0.1);
            --radius: 18px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }
        .phone-frame {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            height: 100dvh;
            max-height: 900px;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }
        @media (min-width: 500px) {
            .phone-frame {
                border-radius: 20px;
                height: 92vh;
                height: 92dvh;
                max-height: 880px;
                margin: 0 10px;
            }
        }
        .chat-header {
            background: var(--whatsapp-green);
            color: white;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 10;
            flex-shrink: 0;
            min-height: 56px;
        }
        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f9d423, #e6a817);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            position: relative;
        }
        .chat-header .avatar .online-dot {
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            position: absolute;
            bottom: 1px;
            right: 1px;
            border: 2px solid var(--whatsapp-green);
        }
        .chat-header .info { flex: 1; min-width: 0; }
        .chat-header .name { font-weight: 600; font-size: 16px; }
        .chat-header .status { font-size: 12px; opacity: 0.85; }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px;
            background-color: var(--chat-bg);
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='200' height='200' fill='%23efeae2'/%3E%3Ccircle cx='100' cy='100' r='80' fill='none' stroke='%23e2dbd1' stroke-width='0.8' opacity='0.5'/%3E%3C/svg%3E");
            background-size: 180px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .message-wrapper { display: flex; margin: 3px 0; animation: fadeInUp 0.3s ease; }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.bot { justify-content: flex-start; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .bubble {
            max-width: 82%;
            padding: 9px 13px;
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.45;
            word-wrap: break-word;
            position: relative;
            box-shadow: var(--shadow);
        }
        .user .bubble { background: var(--bubble-user); border-top-right-radius: 6px; color: var(--text-dark); }
        .bot .bubble { background: var(--bubble-bot); border-top-left-radius: 6px; color: var(--text-dark); }
        .bubble .time { font-size: 10.5px; color: #888; text-align: right; margin-top: 4px; }
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            min-height: 56px;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 24px;
            border: 1px solid #ddd;
            font-size: 15px;
            background: white;
            outline: none;
        }
        .input-area input:focus { border-color: var(--whatsapp-light-green); }
        .input-area .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--whatsapp-light-green);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }
        .send-btn:active { transform: scale(0.92); background: #075e54; }
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 16px;
            align-items: center;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #b0b0b0;
            animation: typingBounce 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce { 0%,60%,100%{transform:translateY(0);opacity:0.5} 30%{transform:translateY(-8px);opacity:1} }
        .api-config {
            background: #fef9e7;
            padding: 10px;
            font-size: 13px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid #e0d8b0;
            flex-shrink: 0;
        }
        .api-config input { flex:1; padding: 6px; border:1px solid #ccc; border-radius:4px; }
        .api-config button { padding: 6px 12px; background:#128c7e; color:white; border:none; border-radius:4px; font-weight:bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="phone-frame" id="phoneFrame">
        <div class="chat-header">
            <div class="avatar">🎩<div class="online-dot"></div></div>
            <div class="info">
                <div class="name">Rich Dad AI</div>
                <div class="status">en línea · Coach Financiero</div>
            </div>
        </div>
        <div id="apiPanel" class="api-config">
            <span>🔑 API Key:</span>
            <input type="password" id="apiKeyInput" placeholder="sk-...">
            <button onclick="saveApiKey()">Guardar</button>
        </div>
        <div class="chat-area" id="chatArea"></div>
        <div class="typing-indicator" id="typingIndicator" style="display:none; background:var(--chat-bg);"><span></span><span></span><span></span></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off" enterkeyhint="send">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        (function() {
            // Estado financiero local (se mantiene sincronizado con lo que la IA interpreta)
            const STORAGE_KEY = 'richdad_finance_data';
            const CHAT_STORAGE_KEY = 'richdad_chat_history_ai';
            const API_KEY_STORAGE = 'richdad_openai_key';

            let financeData = {
                ingresosMensuales: 0,
                gastosMensuales: 0,
                ingresosPasivos: 0,
                activos: [],
                pasivos: [],
                metaPasivos: 2000,
                historial: []
            };
            let chatHistory = [];
            let isProcessing = false;

            // Cargar datos
            function loadData() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    if (saved) financeData = { ...financeData, ...JSON.parse(saved) };
                } catch(e) {}
                try {
                    const savedChat = localStorage.getItem(CHAT_STORAGE_KEY);
                    if (savedChat) chatHistory = JSON.parse(savedChat);
                } catch(e) {}
            }
            function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(financeData)); }
            function saveChatHistory() {
                if (chatHistory.length > 200) chatHistory = chatHistory.slice(-200);
                localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(chatHistory));
            }

            // API Key
            function getApiKey() { return localStorage.getItem(API_KEY_STORAGE) || ''; }
            function saveApiKey() {
                const key = document.getElementById('apiKeyInput').value.trim();
                if (key) {
                    localStorage.setItem(API_KEY_STORAGE, key);
                    document.getElementById('apiPanel').classList.add('hidden');
                    showWelcomeIfNeeded();
                }
            }
            function checkApiKey() {
                if (getApiKey()) {
                    document.getElementById('apiPanel').classList.add('hidden');
                    return true;
                } else {
                    document.getElementById('apiPanel').classList.remove('hidden');
                    return false;
                }
            }

            // DOM
            const chatArea = document.getElementById('chatArea');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const typingIndicator = document.getElementById('typingIndicator');

            function getTimeStr() {
                const now = new Date();
                return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
            }
            function scrollToBottom() { setTimeout(() => { chatArea.scrollTop = chatArea.scrollHeight; }, 100); }

            function addMessage(sender, text, isHTML=false) {
                const wrapper = document.createElement('div');
                wrapper.className = 'message-wrapper ' + sender;
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                if (isHTML) bubble.innerHTML = text;
                else bubble.textContent = text;
                const timeSpan = document.createElement('div');
                timeSpan.className = 'time';
                timeSpan.textContent = getTimeStr();
                bubble.appendChild(timeSpan);
                wrapper.appendChild(bubble);
                chatArea.appendChild(wrapper);
                scrollToBottom();
                return wrapper;
            }

            function showTyping(show=true) {
                typingIndicator.style.display = show ? 'flex' : 'none';
                scrollToBottom();
            }

            // Construir el contexto financiero para enviar a la IA
            function buildFinancialContext() {
                return `DATOS FINANCIEROS ACTUALES DEL USUARIO:
- Ingresos totales este mes: $${financeData.ingresosMensuales.toFixed(2)}
- Gastos totales este mes: $${financeData.gastosMensuales.toFixed(2)}
- Ingresos pasivos mensuales: $${financeData.ingresosPasivos.toFixed(2)}
- Meta de ingresos pasivos: $${financeData.metaPasivos.toFixed(2)}
- Activos registrados: ${financeData.activos.length ? financeData.activos.map(a => a.desc + ' ($' + a.cantidad + ')').join(', ') : 'Ninguno'}
- Pasivos registrados: ${financeData.pasivos.length ? financeData.pasivos.map(p => p.desc + ' ($' + p.cantidad + ')').join(', ') : 'Ninguno'}
- Ratio de libertad (ingresos pasivos / gastos): ${financeData.gastosMensuales > 0 ? ((financeData.ingresosPasivos / financeData.gastosMensuales)*100).toFixed(1) : 0}%
- ¿Está en círculo de la rata? ${financeData.ingresosPasivos < financeData.gastosMensuales ? 'SÍ' : 'NO (ha escapado)'}`;
            }

            // Llamada a la API de OpenAI
            async function callOpenAI(userMessage) {
                const apiKey = getApiKey();
                if (!apiKey) throw new Error('API key no configurada');

                const systemPrompt = `Eres "Rich Dad AI", un asesor financiero virtual basado en los principios de Robert Kiyosaki (autor de "Padre Rico, Padre Pobre"). Tu misión es ayudar al usuario a ESCAPAR DEL CÍRCULO DE LA RATA y alcanzar la LIBERTAD FINANCIERA.

PRINCIPIOS CLAVE QUE DEBES APLICAR:
- Los activos ponen dinero en tu bolsillo; los pasivos lo sacan.
- La libertad financiera ocurre cuando los ingresos pasivos > gastos totales.
- Debemos enfocarnos en construir activos que generen ingresos pasivos (bienes raíces en renta, dividendos, negocios automatizados, regalías).
- Los pasivos disfrazados de activos (autos de lujo, casa propia si no genera ingreso) son trampas.

ESTILO DE COMUNICACIÓN:
- Sé directo, motivador y ligeramente provocador, como un coach.
- Haz preguntas para profundizar en la situación financiera del usuario.
- Cuando el usuario registre una transacción, INTERPRÉTALA y clasifícala (ingreso, gasto, activo, pasivo) y actualiza TÚ MISMO los datos diciendo explícitamente "ACTUALIZAR_DATOS: tipo=monto|descripción".
- Ejemplo: si dice "gané 500 de renta", responde aconsejando y al final incluye: ACTUALIZAR_DATOS: ingreso_pasivo=500|renta.
- Si dice "compré un auto de 10000", debes advertir que es un pasivo a menos que genere ingresos.
- Monitorea el progreso hacia la meta de ingresos pasivos y alerta cuando los gastos superen los ingresos pasivos.

FORMATO DE ACTUALIZACIÓN (debes incluirlo en tu respuesta cuando corresponda):
ACTUALIZAR_DATOS: acción|cantidad|descripción
Acciones posibles: ingreso, ingreso_pasivo, gasto, activo, pasivo, meta
Ejemplos:
ACTUALIZAR_DATOS: ingreso=500|salario
ACTUALIZAR_DATOS: ingreso_pasivo=300|renta departamento
ACTUALIZAR_DATOS: gasto=200|supermercado
ACTUALIZAR_DATOS: activo=50000|casa en renta
ACTUALIZAR_DATOS: pasivo=15000|préstamo auto
ACTUALIZAR_DATOS: meta=3000

Si no hay transacción que registrar, NO incluyas ACTUALIZAR_DATOS.

${buildFinancialContext()}

Responde siempre en español, en formato conversacional de chat.`;

                const messages = [
                    { role: "system", content: systemPrompt },
                    ...chatHistory.slice(-10).map(msg => ({
                        role: msg.sender === 'user' ? 'user' : 'assistant',
                        content: msg.text
                    })),
                    { role: "user", content: userMessage }
                ];

                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'gpt-4o-mini',
                        messages: messages,
                        temperature: 0.7,
                        max_tokens: 600
                    })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error?.message || 'Error en la API');
                }

                const data = await response.json();
                return data.choices[0].message.content;
            }

            // Procesar directivas de actualización en la respuesta de la IA
            function processUpdates(aiText) {
                const regex = /ACTUALIZAR_DATOS:\s*(.+)/g;
                let match;
                let updated = false;
                while ((match = regex.exec(aiText)) !== null) {
                    const content = match[1].trim();
                    const parts = content.split('|');
                    if (parts.length >= 2) {
                        const accion = parts[0].split('=');
                        if (accion.length === 2) {
                            const tipo = accion[0].trim();
                            const cantidad = parseFloat(accion[1]);
                            const desc = parts[1]?.trim() || 'Sin descripción';
                            if (!isNaN(cantidad)) {
                                switch(tipo) {
                                    case 'ingreso':
                                        financeData.ingresosMensuales += cantidad;
                                        break;
                                    case 'ingreso_pasivo':
                                        financeData.ingresosPasivos += cantidad;
                                        financeData.ingresosMensuales += cantidad;
                                        break;
                                    case 'gasto':
                                        financeData.gastosMensuales += cantidad;
                                        break;
                                    case 'activo':
                                        financeData.activos.push({ cantidad, desc, fecha: new Date().toISOString() });
                                        financeData.gastosMensuales += cantidad; // asumimos que el activo se compró y es un gasto inicial
                                        break;
                                    case 'pasivo':
                                        financeData.pasivos.push({ cantidad, desc, fecha: new Date().toISOString() });
                                        financeData.gastosMensuales += cantidad;
                                        break;
                                    case 'meta':
                                        financeData.metaPasivos = cantidad;
                                        break;
                                }
                                updated = true;
                            }
                        }
                    }
                }
                if (updated) saveData();
                // Quitar las directivas del texto visible
                return aiText.replace(/ACTUALIZAR_DATOS:.*$/gm, '').trim();
            }

            async function sendMessage() {
                if (isProcessing) return;
                const userText = messageInput.value.trim();
                if (!userText) return;
                if (!getApiKey()) {
                    alert('Por favor configura tu API key de OpenAI primero.');
                    return;
                }

                isProcessing = true;
                messageInput.value = '';
                addMessage('user', userText);
                chatHistory.push({ sender: 'user', text: userText, time: getTimeStr() });
                showTyping(true);

                try {
                    const aiResponse = await callOpenAI(userText);
                    const cleanResponse = processUpdates(aiResponse);
                    showTyping(false);
                    addMessage('bot', cleanResponse, true);
                    chatHistory.push({ sender: 'bot', text: cleanResponse, time: getTimeStr() });
                    saveChatHistory();
                } catch (error) {
                    showTyping(false);
                    addMessage('bot', `❌ Error: ${error.message}. Verifica tu API key y conexión.`, false);
                } finally {
                    isProcessing = false;
                    scrollToBottom();
                }
            }

            function showWelcomeIfNeeded() {
                if (chatHistory.length === 0 && getApiKey()) {
                    const welcome = `🎩 ¡Bienvenido! Soy <b>Rich Dad AI</b>, tu coach financiero con inteligencia artificial. Estoy aquí para guiarte a escapar del círculo de la rata.<br><br>Cuéntame sobre tu situación financiera actual: ¿cuáles son tus ingresos, gastos, deudas? ¿Tienes activos que generen ingresos pasivos?<br><br>Puedes hablarme con total naturalidad, y yo iré registrando tus datos y dándote un plan personalizado.`;
                    addMessage('bot', welcome, true);
                    chatHistory.push({ sender: 'bot', text: welcome, time: getTimeStr() });
                    saveChatHistory();
                }
            }

            // Inicialización
            loadData();
            if (checkApiKey()) {
                // Restaurar historial si existe
                if (chatHistory.length > 0) {
                    chatHistory.forEach(msg => addMessage(msg.sender, msg.text, msg.sender==='bot'));
                } else {
                    showWelcomeIfNeeded();
                }
            }

            // Listeners
            sendBtn.addEventListener('click', sendMessage);
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Exponer funciones globales
            window.sendMessage = sendMessage;
            window.saveApiKey = saveApiKey;
        })();
    </script>
</body>
</html>
